<!DOCTYPE html>
<!--
	TEMPORARY iOS audio diagnostic (2026-09-20). Not linked from anywhere; delete
	once the /play/ no-sound report on iPhone is settled.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PolyBall audio check</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0; padding: 20px 18px 60px;
		background: #08090c; color: #edeef2;
		font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	}
	h1 { font-size: 20px; margin: 0 0 4px; }
	p.sub { margin: 0 0 20px; color: #9aa0ad; font-size: 14px; }
	button {
		display: block; width: 100%; margin: 0 0 12px;
		padding: 18px 16px; border: 0; border-radius: 12px;
		background: #5ad1e6; color: #04121a;
		font: 600 17px/1.2 inherit; cursor: pointer;
		-webkit-tap-highlight-color: transparent;
	}
	button.alt { background: #1b1e26; color: #edeef2; }
	#log {
		margin-top: 18px; padding: 14px; border-radius: 12px;
		background: #0e0f14; border: 1px solid #1d2029;
		font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
		white-space: pre-wrap; word-break: break-word;
	}
	.ok { color: #4bd86b; } .bad { color: #ff5a5a; } .dim { color: #9aa0ad; }
</style>
</head>
<body>
<h1>PolyBall audio check</h1>
<p class="sub">Put the phone's ringer switch to SILENT first, then tap the buttons in order.</p>

<button id="b1">1 &nbsp;Beep — Web Audio only</button>
<button id="b2">2 &nbsp;Beep — with the silent-element fix</button>
<button id="b3" class="alt">3 &nbsp;Stop the silent loop</button>
<button id="b4" class="alt">4 &nbsp;Show state again</button>

<div id="log">tap a button…</div>

<script>
(() => {
	const logEl = document.getElementById('log');
	const lines = [];
	const log = (s, cls) => {
		lines.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s);
		logEl.innerHTML = lines.slice(-40).join('\n');
	};

	const AC = window.AudioContext || window.webkitAudioContext;
	let ctx = null;
	let silent = null;

	log('UA: ' + navigator.userAgent, 'dim');
	log('AudioContext: ' + (window.AudioContext ? 'yes' : 'no') +
		' | webkitAudioContext: ' + (window.webkitAudioContext ? 'yes' : 'no'));
	if (!AC) log('NO WEB AUDIO AT ALL — that alone would explain the silence.', 'bad');

	// A silent looping WAV. Playing a media element moves an iOS page out of the
	// ambient audio session, so the hardware ringer switch stops muting Web Audio.
	const silentUrl = () => {
		const rate = 8000, frames = rate / 2, b = new Uint8Array(44 + frames);
		const view = new DataView(b.buffer);
		const tag = (off, s) => { for (let i = 0; i < s.length; i++) b[off + i] = s.charCodeAt(i); };
		tag(0, 'RIFF'); view.setUint32(4, 36 + frames, true); tag(8, 'WAVEfmt ');
		view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
		view.setUint32(24, rate, true); view.setUint32(28, rate, true);
		view.setUint16(32, 1, true); view.setUint16(34, 8, true);
		tag(36, 'data'); view.setUint32(40, frames, true); b.fill(128, 44);
		return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
	};

	// Everything below runs inside the tap handler: iOS only honours resume() and
	// media playback started synchronously from a real gesture.
	const beep = (label) => {
		if (!AC) return;
		if (ctx === null) {
			ctx = new AC();
			log('created context: ' + ctx.state + ' @ ' + ctx.sampleRate + ' Hz');
		}
		const before = ctx.state;
		const p = ctx.resume();
		log(label + ': state before resume = ' + before);
		const osc = ctx.createOscillator();
		const gain = ctx.createGain();
		osc.type = 'sine';
		osc.frequency.value = 440;
		gain.gain.value = 0.0001;
		gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.05);
		gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
		osc.connect(gain).connect(ctx.destination);
		osc.start();
		osc.stop(ctx.currentTime + 0.85);
		if (p && p.then) {
			p.then(() => log('  state after resume = ' + ctx.state,
				ctx.state === 'running' ? 'ok' : 'bad'));
		}
	};

	document.getElementById('b1').addEventListener('click', () => {
		beep('TEST 1 (no fix)');
		log('  silent loop playing: ' + (silent !== null && !silent.paused));
	});

	document.getElementById('b2').addEventListener('click', () => {
		if (silent === null) {
			silent = new Audio(silentUrl());
			silent.loop = true;
			silent.setAttribute('playsinline', '');
		}
		const play = silent.play();
		if (play && play.catch) play.catch((e) => log('  silent element refused: ' + e, 'bad'));
		beep('TEST 2 (silent-element fix)');
		log('  silent loop playing: ' + !silent.paused, !silent.paused ? 'ok' : 'bad');
	});

	document.getElementById('b3').addEventListener('click', () => {
		if (silent !== null) { silent.pause(); log('silent loop stopped.'); }
	});

	document.getElementById('b4').addEventListener('click', () => {
		log('context: ' + (ctx ? ctx.state + ' @ ' + ctx.sampleRate + ' Hz' : 'none yet'));
		log('silent loop playing: ' + (silent !== null && !silent.paused));
	});
})();
</script>
</body>
</html>
