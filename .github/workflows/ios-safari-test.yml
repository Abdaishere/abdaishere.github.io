name: iPhone Safari test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to open in Mobile Safari'
        required: false
        default: 'https://abdaishere.com/polyball/play/'

jobs:
  safari-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iphone-se-ios18
            device_query: 'iPhone SE'
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-18-5
          - label: ipad-ios26
            device_query: 'iPad'
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-26-1
          - label: iphone16-ios18
            device_query: 'iPhone 16'
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-18-5
    steps:
      - name: Show Xcode and runtime info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Create and boot simulator
        id: boot
        run: |
          DEVICETYPE_ID=$(xcrun simctl list devicetypes | grep -F "${{ matrix.device_query }}" | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9_-]+' | head -1)
          if [ -z "$DEVICETYPE_ID" ]; then
            echo "No device type matched '${{ matrix.device_query }}'"
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Using device type: $DEVICETYPE_ID"
          UDID=$(xcrun simctl create "ci-${{ matrix.label }}" "$DEVICETYPE_ID" "${{ matrix.runtime_id }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Open URL in Mobile Safari
        run: |
          UDID="${{ steps.boot.outputs.udid }}"
          URL="${{ github.event.inputs.url || 'https://abdaishere.com/polyball/play/' }}"
          xcrun simctl openurl "$UDID" "$URL"

      - name: Wait for page load
        run: sleep 8

      - name: Screenshot - initial load
        run: |
          mkdir -p artifacts
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/01-initial.png

      - name: Wait and take mid-load screenshot
        run: |
          sleep 10
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/02-after-load.png

      - name: Wait and take final screenshot
        run: |
          sleep 10
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/03-final.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-safari-test-${{ matrix.label }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 5

