name: iPhone Safari test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to open in Mobile Safari'
        required: false
        default: 'https://abdaishere.com/polyball/play/'
      device:
        description: 'Simulator device name'
        required: false
        default: 'iPhone 16'

jobs:
  safari-test:
    runs-on: macos-14
    steps:
      - name: Show Xcode and runtime info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Boot simulator
        id: boot
        run: |
          DEVICE="${{ github.event.inputs.device || 'iPhone 16' }}"
          UDID=$(xcrun simctl list devices available | grep "$DEVICE (" | grep -oE '[0-9A-F-]{36}' | head -1)
          if [ -z "$UDID" ]; then
            echo "Device '$DEVICE' not found, listing available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Open URL in Mobile Safari
        run: |
          UDID="${{ steps.boot.outputs.udid }}"
          URL="${{ github.event.inputs.url || 'https://abdaishere.com/polyball/play/' }}"
          xcrun simctl openurl "$UDID" "$URL"

      - name: Wait for page load
        run: sleep 8

      - name: Screenshot - initial load
        run: |
          mkdir -p artifacts
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/01-initial.png

      - name: Start screen recording
        run: |
          UDID="${{ steps.boot.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo artifacts/video.mov &
          echo $! > record.pid
          sleep 1

      - name: Wait and take mid-load screenshot
        run: |
          sleep 10
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/02-after-load.png

      - name: Wait and take final screenshot
        run: |
          sleep 10
          xcrun simctl io "${{ steps.boot.outputs.udid }}" screenshot artifacts/03-final.png

      - name: Stop screen recording
        run: |
          kill -INT "$(cat record.pid)" || true
          sleep 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-safari-test-${{ github.run_number }}
          path: artifacts/
          retention-days: 5

# v1 scope: load + screenshots + video only, no interaction.
# To add taps/input later: drive the simulator with XCUITest (a small .xctestplan
# tapping WKWebView coordinates) or idb (`idb ui tap`), both macOS-runner-only.
#
# WebGL in iOS Simulator on GitHub-hosted macOS runners loses context on load
# (tested iPhone 16 + iPhone SE + iPad, iOS 18.5/26.1, macos-15): simulator GPU
# acceleration is not available in these VMs. macos-14 tried as a second runner
# image for the same reason. Real-device Safari is unaffected; this is a
# simulator/CI limitation, not a site bug.
