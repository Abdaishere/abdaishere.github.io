<!-- Share card for links to /polyball/play/ (tools/make_og.py). Single-quoted attributes: this whole block is one cfg string. -->

<meta property='og:url' content='https://abdaishere.com/polyball/play/'>

<script>
// Godot's web Sample playback fakes loops: on 'ended' it starts a new source (a gap)
// from the FIRST play()'s offset, so the looping bed drifted and clicked every 19.2 s.
// The bed is the only looping sound and the only buffer over 10 s: loop it natively.
window.AudioBufferSourceNode && (() => {
	const start = AudioBufferSourceNode.prototype.start;
	AudioBufferSourceNode.prototype.start = function (when = 0, offset = 0, ...rest) {
		if (this.buffer && this.buffer.duration > 10) {
			this.loop = true;
			offset %= this.buffer.duration;
		}
		return start.call(this, when, offset, ...rest);
	};
})();
// iOS Safari plays a WebAudio-only page in the AMBIENT audio session, which the
// hardware ringer switch silences, and its AudioContext only resumes inside a real
// gesture handler. Track every context; on each tap resume it synchronously and keep
// a silent looping audio element playing, which promotes the page to a media session
// the ringer switch no longer mutes. Everything here is guarded: on a browser that
// never needed it, the element simply plays silence.
try {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (AC) {
		const ctxs = [];
		class TrackedAudioContext extends AC {
			constructor(...args) {
				super(...args);
				ctxs.push(this);
			}
		}
		window.AudioContext = TrackedAudioContext;
		if (window.webkitAudioContext) {
			window.webkitAudioContext = TrackedAudioContext;
		}
		// 0.5 s of 8-bit silence, built here so the shim carries no base64 payload.
		const silentUrl = () => {
			const rate = 8000, frames = rate / 2, b = new Uint8Array(44 + frames);
			const view = new DataView(b.buffer);
			const tag = (off, s) => {
				for (let i = 0; i < s.length; i++) b[off + i] = s.charCodeAt(i);
			};
			tag(0, 'RIFF');
			view.setUint32(4, 36 + frames, true);
			tag(8, 'WAVEfmt ');
			view.setUint32(16, 16, true);
			view.setUint16(20, 1, true);
			view.setUint16(22, 1, true);
			view.setUint32(24, rate, true);
			view.setUint32(28, rate, true);
			view.setUint16(32, 1, true);
			view.setUint16(34, 8, true);
			tag(36, 'data');
			view.setUint32(40, frames, true);
			b.fill(128, 44);
			return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
		};
		let el = null;
		const kick = () => {
			try {
				for (const c of ctxs) {
					if (c.state !== 'running') c.resume();
				}
				if (el === null) {
					el = new Audio(silentUrl());
					el.loop = true;
					el.setAttribute('playsinline', '');
				}
				if (el.paused) el.play().catch(() => {});
			} catch (err) { /* never break the game over audio */ }
		};
		for (const type of ['touchend', 'pointerup', 'mouseup', 'click', 'keydown']) {
			window.addEventListener(type, kick, { capture: true });
		}
		// Read from the console (or the /audio-test.html page) when diagnosing.
		window.polyballAudioState = () => ({
			contexts: ctxs.map((c) => c.state + ' @' + c.sampleRate),
			silentLoop: el !== null && !el.paused,
		});
	}
} catch (err) { /* no audio fix, but the game still boots */ }
</script>
<!-- QA PF-01: after the download the engine starts on the page's only thread and
     the page cannot paint for several seconds. A transform/opacity animation runs
     on the compositor, so this ring keeps turning through that and the loader
     never looks hung. It lives on #status, which the shell removes once the game
     is up. -->
<style>
#status::after { content: ''; position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; box-sizing: border-box; border-radius: 50%; border: 4px solid rgba(90, 209, 230, 0.18); border-top-color: #5ad1e6; animation: pb-load-spin 0.9s linear infinite; will-change: transform; }
@keyframes pb-load-spin { to { transform: rotate(360deg); } }
@keyframes pb-load-pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { #status::after { animation: pb-load-pulse 2s ease-in-out infinite; will-change: opacity; } }
</style>
<script>
// Godot's web build plays straight through Web Audio and skips every bus effect:
// no reverb, no echo, no master limiter, so the browser mix was dry, mono and,
// for want of a limiter, had to sit quieter (audit 2026-10-08, finding 8). Every
// sound reaches the speakers through the master's one connection to the
// destination, so put the browser's own nodes on that path: a limiter, which
// lets web run at the app's loudness, and a light stereo room for the space and
// width the app's reverbs give. Knobs: window.polyballWebMix (wet, limiter dB).
window.AudioNode && window.AudioDestinationNode && (() => {
	const mix = window.polyballWebMix = window.polyballWebMix || { wet: 0.55, ceiling: -1.0 };
	const connect = AudioNode.prototype.connect;
	const chains = new WeakMap();
	const room = (ctx) => {
		// 1.8 s of decaying, darkening stereo noise after an 18 ms gap: the same
		// kind of tail as the app's reverbs, L and R independent for width.
		const sr = ctx.sampleRate, n = Math.floor(1.8 * sr), pre = Math.floor(0.018 * sr);
		const ir = ctx.createBuffer(2, n, sr);
		for (let ch = 0; ch < 2; ch++) {
			const d = ir.getChannelData(ch);
			let lp = 0, e = 0;
			for (let i = pre; i < n; i++) {
				const t = (i - pre) / sr;
				const k = Math.min(0.92, 0.25 + t * 0.6);  // brighter early, duller late
				lp += (Math.random() * 2 - 1 - lp) * (1 - k);
				d[i] = lp * Math.exp(-t / 0.42);
				e += d[i] * d[i];
			}
			const g = 1 / Math.sqrt(e);
			for (let i = 0; i < n; i++) d[i] *= g;
		}
		return ir;
	};
	const chainFor = (ctx) => {
		let c = chains.get(ctx);
		if (c) return c;
		const input = ctx.createGain();
		const lim = ctx.createDynamicsCompressor();
		lim.threshold.value = mix.ceiling;
		lim.knee.value = 0;
		lim.ratio.value = 20;
		lim.attack.value = 0.001;
		lim.release.value = 0.1;
		const verb = ctx.createConvolver();
		verb.normalize = false;
		verb.buffer = room(ctx);
		const wet = ctx.createGain();
		wet.gain.value = mix.wet;
		connect.call(input, lim);
		connect.call(input, verb);
		connect.call(verb, wet);
		connect.call(wet, lim);
		connect.call(lim, ctx.destination);
		c = { input, wet, lim };
		chains.set(ctx, c);
		window.polyballWebMixNodes = c;
		// What the browser says sits between this context and the ear (Bluetooth
		// included where the OS tells it): GameState reads it as the route latency.
		window.polyballOutputLatencyMs = () => Math.round(((ctx.outputLatency || 0) + (ctx.baseLatency || 0)) * 1000);
		return c;
	};
	AudioNode.prototype.connect = function (dest, ...rest) {
		if (dest instanceof AudioDestinationNode) {
			return connect.call(this, chainFor(dest.context).input, ...rest);
		}
		return connect.call(this, dest, ...rest);
	};
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10140804,"index.wasm":29495521},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
