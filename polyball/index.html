<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>PolyBall</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #08090c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script>
// Godot's web Sample playback fakes loops: on 'ended' it starts a new source (a gap)
// from the FIRST play()'s offset, so the looping bed drifted and clicked every 19.2 s.
// The bed is the only looping sound and the only buffer over 10 s: loop it natively.
window.AudioBufferSourceNode && (() => {
	const start = AudioBufferSourceNode.prototype.start;
	AudioBufferSourceNode.prototype.start = function (when = 0, offset = 0, ...rest) {
		if (this.buffer && this.buffer.duration > 10) {
			this.loop = true;
			offset %= this.buffer.duration;
		}
		return start.call(this, when, offset, ...rest);
	};
})();
// iOS Safari plays a WebAudio-only page in the AMBIENT audio session, which the
// hardware ringer switch silences, and its AudioContext only resumes inside a real
// gesture handler. Track every context; on each tap resume it synchronously and keep
// a silent looping audio element playing, which promotes the page to a media session
// the ringer switch no longer mutes. Everything here is guarded: on a browser that
// never needed it, the element simply plays silence.
try {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (AC) {
		const ctxs = [];
		class TrackedAudioContext extends AC {
			constructor(...args) {
				super(...args);
				ctxs.push(this);
			}
		}
		window.AudioContext = TrackedAudioContext;
		if (window.webkitAudioContext) {
			window.webkitAudioContext = TrackedAudioContext;
		}
		// 0.5 s of 8-bit silence, built here so the shim carries no base64 payload.
		const silentUrl = () => {
			const rate = 8000, frames = rate / 2, b = new Uint8Array(44 + frames);
			const view = new DataView(b.buffer);
			const tag = (off, s) => {
				for (let i = 0; i < s.length; i++) b[off + i] = s.charCodeAt(i);
			};
			tag(0, 'RIFF');
			view.setUint32(4, 36 + frames, true);
			tag(8, 'WAVEfmt ');
			view.setUint32(16, 16, true);
			view.setUint16(20, 1, true);
			view.setUint16(22, 1, true);
			view.setUint32(24, rate, true);
			view.setUint32(28, rate, true);
			view.setUint16(32, 1, true);
			view.setUint16(34, 8, true);
			tag(36, 'data');
			view.setUint32(40, frames, true);
			b.fill(128, 44);
			return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
		};
		let el = null;
		const kick = () => {
			try {
				for (const c of ctxs) {
					if (c.state !== 'running') c.resume();
				}
				if (el === null) {
					el = new Audio(silentUrl());
					el.loop = true;
					el.setAttribute('playsinline', '');
				}
				if (el.paused) el.play().catch(() => {});
			} catch (err) { /* never break the game over audio */ }
		};
		for (const type of ['touchend', 'pointerup', 'mouseup', 'click', 'keydown']) {
			window.addEventListener(type, kick, { capture: true });
		}
		// Read from the console (or the /audio-test.html page) when diagnosing.
		window.polyballAudioState = () => ({
			contexts: ctxs.map((c) => c.state + ' @' + c.sampleRate),
			silentLoop: el !== null && !el.paused,
		});
	}
} catch (err) { /* no audio fix, but the game still boots */ }
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9877772,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
